<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QQ 聊天记录阅读器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 顶部状态栏（模拟） -->
        <header class="qq-header">
            <div class="header-left">
                <span class="back-icon">❮</span>
                <span id="chat-title">聊天记录</span>
            </div>
            <div class="header-right">
                <span class="menu-icon">⋮</span>
            </div>
        </header>

        <!-- 聊天内容区域 -->
        <main id="chat-container">
            <div id="welcome-screen">
                <div class="logo">QQ</div>
                <p>请选择导出的 QQ 聊天记录 TXT 文件</p>
                <p class="hint">支持 2023 年及以前导出的标准格式</p>
                
                <div class="quick-select">
                    <button id="quick-load-btn" class="secondary-button">直接读取：深拥我！.txt</button>
                </div>

                <div class="divider"><span>或者</span></div>

                <input type="file" id="file-input" accept=".txt">
                <label for="file-input" class="custom-file-upload">选择本地文件</label>
            </div>
            <div id="messages-list" class="hidden"></div>
        </main>

        <!-- 底部输入栏（模拟，仅用于 UI 完整性） -->
        <footer class="qq-footer hidden">
            <div class="footer-input-container">
                <div class="voice-icon">🎤</div>
                <input type="text" readonly placeholder="仅供预览">
                <div class="emoji-icon">😊</div>
                <div class="plus-icon">⊕</div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
